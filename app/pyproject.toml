[project]
name = "agent-service"
version = "0.1.0"
description = "FastAPI service with a streaming /chat endpoint driven by a LangGraph ReAct agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.3",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2.2",
    "langchain-qdrant>=0.2",
    "langchain-text-splitters>=0.3.4",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
