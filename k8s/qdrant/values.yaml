# Passed to the upstream chart; anything not listed keeps its default.
# See `helm show values qdrant/qdrant --version 1.19.0`.
qdrant:
  # Plain `qdrant`, which is what app/app/config.py defaults to.
  fullnameOverride: qdrant

  replicaCount: 1

  persistence:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
