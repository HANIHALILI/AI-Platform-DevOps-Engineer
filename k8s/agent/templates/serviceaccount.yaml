{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent.serviceAccountName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
No API token is projected into the Pod: the Agent service never talks to the
Kubernetes API, so there is nothing for a compromised container to reach with.
The Pod spec sets automountServiceAccountToken as well, since the Pod-level
setting is the one that actually wins.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
