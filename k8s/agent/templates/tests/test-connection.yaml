{{- /*
`helm test <release>` — proves the Service resolves and the Agent service
answers from inside the cluster.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "agent.fullname" . }}-test-connection
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      args:
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - http://{{ include "agent.fullname" . }}:{{ .Values.service.port }}/healthz
