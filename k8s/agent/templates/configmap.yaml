{{- if .Values.config }}
{{- /*
Non-secret configuration only. The Agent service reads everything from the
environment (app/config.py), so these land as env vars via `envFrom`.
Secrets belong in a Secret referenced through `extraEnvFrom`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.fullname" . }}-config
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
