# Default values for the Agent service chart.
# Defaults target the local kind cluster in this repository; override per
# environment with `-f values-<env>.yaml` or `--set`.

replicaCount: 2

image:
  # The reference pushed from the host, resolved in-cluster through the containerd
  # mirror on each node, so no imagePullSecrets are needed.
  repository: localhost:5001/agent
  # The commit that last touched app/. `make release` writes this line.
  tag: 155548c
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The service never calls the Kubernetes API, so it gets no token to steal.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

service:
  # The only piece of the stack called from outside; Ollama and Qdrant stay ClusterIP.
  # k8s/kind-config.yaml maps 30080 to host :8080.
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080
  annotations: {}

containerPort: 8000

# Rendered into a ConfigMap and consumed with `envFrom`. Anything left out keeps the
# default app/agent/config.py declares. A change here rolls the Pods via the checksum.
config:
  AGENT_LOG_LEVEL: INFO
  # Spelled out even though they match the app defaults: where the agent connects
  # belongs in the cluster's configuration, not in the image. /v1 is the
  # OpenAI-compatible API; the embeddings client uses Ollama's own API at the root.
  AGENT_LLM_URL: http://ollama:11434/v1
  AGENT_EMBED_URL: http://ollama:11434
  AGENT_QDRANT_URL: http://qdrant:6333
  # `model.servedAs` in k8s/ollama/values.yaml, not a base model: the weights behind
  # that name change there without this value moving.
  AGENT_LLM_MODEL: agent-llm
  AGENT_EMBED_MODEL: all-minilm

# Rendered into a Secret, same envFrom treatment as `config`. Placeholders for this
# local stack; real credentials are passed at install time:
#
#   helm upgrade --install agent k8s/agent \
#     --set-string secrets.AGENT_QDRANT_KEY="$QDRANT_KEY"
secrets:
  # Ollama does not authenticate, but the OpenAI client refuses to start without a key.
  AGENT_LLM_KEY: not-needed
  # Qdrant runs unauthenticated here; config.py reads empty as "no key".
  AGENT_QDRANT_KEY: ""

extraEnv: []
extraEnvFrom: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# Both requests and limits are set: requests drive scheduling, limits stop one
# replica from starving its node.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Must agree with the numeric USER baked into the image (uid/gid 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# /healthz touches no external service, or an LLM outage restart-loops every replica.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# /readyz returns 503 while the LLM is unreachable, so a replica that cannot serve
# leaves the endpoints instead of restarting. timeoutSeconds exceeds READY_TIMEOUT.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 6
  failureThreshold: 3

startupProbe: {}

# The root filesystem is read-only; /tmp is the only writable path.
tmpVolume:
  sizeLimit: 64Mi

# Schedule only onto worker nodes, which carry workload=agent.
nodeSelector:
  workload: agent

tolerations: []
affinity: {}

# One Pod per node. With DoNotSchedule, replicas that cannot spread stay Pending
# instead of quietly co-locating.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

# maxSurge 0: with topologySpread on DoNotSchedule a surge Pod has no node to land on.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

terminationGracePeriodSeconds: 30

revisionHistoryLimit: 3
