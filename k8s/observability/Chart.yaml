apiVersion: v2
name: observability
description: Prometheus, Grafana, Loki and Promtail for the AI platform
type: application
version: 0.1.0
kubeVersion: ">=1.27.0-0"
# Pinned exactly, and Chart.lock and charts/*.tgz are committed: Argo CD renders
# this chart from the lock, so a range would put an upstream release in the
# cluster with no commit behind it.
dependencies:
  - name: kube-prometheus-stack
    version: "75.18.1"
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: "6.55.0"
    repository: https://grafana.github.io/helm-charts
  - name: promtail
    version: "6.17.1"
    repository: https://grafana.github.io/helm-charts
