apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-observability-dashboard
  labels:
    grafana_dashboard: "1"
data:
  agent-observability.json: |
    {
      "annotations":{"list":[]},
      "editable":true,
      "panels":[
        {"type":"timeseries","title":"Total chat requests by status","targets":[{"expr":"sum by (status) (chat_requests_total)","legendFormat":"{{ "{{status}}" }}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0,"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0}},
        {"type":"timeseries","title":"Streaming latency (p95)","targets":[{"expr":"histogram_quantile(0.95, sum(rate(chat_ttft_seconds_bucket[5m])) by (le))","legendFormat":"TTFT"},{"expr":"histogram_quantile(0.95, sum(rate(chat_duration_seconds_bucket[5m])) by (le))","legendFormat":"full response"}],"fieldConfig":{"defaults":{"decimals":2,"min":0,"unit":"s"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":0}},
        {"type":"timeseries","title":"Agent CPU usage (mCPU)","targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\",pod=~\"agent-.*\",container!=\"\",image!=\"\"}[5m])) * 1000","legendFormat":"{{ "{{pod}}" }}"}],"fieldConfig":{"defaults":{"decimals":1,"min":0,"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":8}},
        {"type":"timeseries","title":"Agent memory working set (GiB)","targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\",pod=~\"agent-.*\",container!=\"\",image!=\"\"}) / 1024 / 1024 / 1024","legendFormat":"{{ "{{pod}}" }}"}],"fieldConfig":{"defaults":{"decimals":3,"min":0,"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":8}},
        {"type":"timeseries","title":"Total chat completions","targets":[{"expr":"sum by (finish_reason) (chat_requests_total)","legendFormat":"{{ "{{finish_reason}}" }}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0,"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":16}},
        {"type":"timeseries","title":"Tool calls by tool and status","targets":[{"expr":"sum by (tool, status) (tool_calls_total)","legendFormat":"{{ "{{tool}}" }} / {{ "{{status}}" }}"}],"fieldConfig":{"defaults":{"decimals":0,"min":0,"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":16}}
      ],
      "schemaVersion":39,
      "tags":["agent","streaming","performance"],
      "time":{"from":"now-1h","to":"now"},
      "title":"Agent observability",
      "uid":"agent-observability"
    }
