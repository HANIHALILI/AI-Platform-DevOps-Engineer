image:
  repository: ollama/ollama
  # Empty => Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# `repository:variant-quantization` is the tag pulled from ollama.com; `servedAs` is
# what the init container builds from it, and the only name the agent knows.
model:
  repository: qwen3
  variant: 4b
  quantization: q4_K_M
  servedAs: agent-llm

# Embeddings, pulled as-is. all-minilm ships one 45MB build, so no quantization
# to choose.
embedModel: all-minilm

# Written into the Modelfile as PARAMETER lines, so they become the defaults of
# the served model and apply to any caller that does not override them.
inference:
  # Ollama defaults to 2048, which the system prompt plus a search_docs result
  # overflows, and it drops the oldest messages silently when it does.
  contextLength: 8192
  numPredict: 512
  topK: 40
  topP: 0.9
  # Left at 0 Ollama sizes the thread pool from the node's cores and not from the
  # cgroup, so a limited Pod oversubscribes and gets throttled. Keep it equal to
  # resources.limits.cpu.
  numThread: 4

# Process-wide limits, passed as environment variables. Unlike the block above
# these bound the server across all models and requests.
server:
  # Requests decoded concurrently per model. Each holds its own context window, so
  # memory scales with this. One slot per CPU: the fourth raised aggregate throughput
  # 63% over three (benchmarks/results.md).
  numParallel: 4
  # The LLM and the embedding model, both resident.
  maxLoadedModels: 2
  # How long an idle model stays loaded. Shorter gives the memory back and pays the
  # load again on the next request.
  keepAlive: 24h

service:
  type: ClusterIP
  # Ollama's own port, and the one app/app/config.py defaults to.
  port: 11434

# Model cache. Without it every restart re-downloads the weights.
persistence:
  enabled: true
  size: 20Gi
  # Empty => the cluster default StorageClass.
  storageClassName: ""

# CPU-only: the Modelfile pins `num_gpu 0` and nothing requests nvidia.com/gpu.
# Keep limits.cpu and inference.numThread equal.
resources:
  requests:
    cpu: "1"
    # Room for the four 8192-token slots, so the scheduler cannot place competing
    # memory-heavy work here. Measured at 7.6Gi resident (benchmarks/results.md).
    memory: 20Gi
  limits:
    cpu: "4"
    # The node has 32Gi; leave headroom for Kubernetes and other workloads.
    memory: 24Gi

# The image ships no non-root user. HOME points at the mounted volume, so the models
# and the registry key land there and not on the read-only root filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Loading the model into memory takes longer than liveness tolerates; liveness
# does not start until this passes.
startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  failureThreshold: 60

# Ollama serves no /health, so /api/tags is what proves the API answers. Slack timing:
# CPU-only inference saturates the node and must not be restarted mid-generation.
livenessProbe:
  httpGet:
    path: /api/tags
    port: http
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

# /api/tags lists the models on disk, so this stays down until they are there.
readinessProbe:
  httpGet:
    path: /api/tags
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []

terminationGracePeriodSeconds: 60
