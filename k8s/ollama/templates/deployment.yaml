apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  # One replica holding one ReadWriteOnce volume, so Recreate rather than
  # RollingUpdate: a surge Pod could not attach the volume and would hang.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ollama.selectorLabels" . | nindent 8 }}
      annotations:
        # Rebuilds the served model when the Modelfile changes; without it a
        # `helm upgrade` that only retunes inference leaves the Pod as it was.
        checksum/modelfile: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pulling here rather than after startup means a Ready Pod is one that can
      # answer. `ollama pull` talks to the HTTP API, hence the throwaway server.
      initContainers:
        - name: pull-models
          image: {{ include "ollama.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              for i in $(seq 60); do
                if ollama list >/dev/null 2>&1; then break; fi
                sleep 1
              done
              # `show` is the cheap existence check: on a restart the weights are
              # already on the volume and nothing touches the network.
              for model in "$BASE_MODEL" "$EMBED_MODEL"; do
                ollama show "$model" >/dev/null 2>&1 || ollama pull "$model"
              done
              ollama create "$SERVED" -f /modelfile/Modelfile
          env:
            - name: BASE_MODEL
              value: {{ include "ollama.baseModel" . | quote }}
            - name: EMBED_MODEL
              value: {{ .Values.embedModel | quote }}
            - name: SERVED
              value: {{ .Values.model.servedAs | quote }}
            - name: HOME
              value: /models
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: modelfile
              mountPath: /modelfile
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "ollama.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: HOME
              value: /models
            # The server-side default for callers that send no num_ctx of their
            # own; the Modelfile carries the same number for the served model.
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ .Values.inference.contextLength | quote }}
            - name: OLLAMA_NUM_PARALLEL
              value: {{ .Values.server.numParallel | quote }}
            - name: OLLAMA_MAX_LOADED_MODELS
              value: {{ .Values.server.maxLoadedModels | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.server.keepAlive | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ollama.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: modelfile
          configMap:
            name: {{ include "ollama.fullname" . }}-modelfile
        - name: tmp
          emptyDir: {}
